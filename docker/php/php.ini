date.timezone=Asia/Jakarta
display_errors=Off
expose_php=Off
log_errors=On
memory_limit=256M
max_execution_time=60
max_input_time=60
# Formulir pengumpulan menerima lima foto sekaligus, masing-masing sebesar
# UPLOAD_MAX_IMAGE_KB (baku 5 MB). Batas POST harus melampaui total tersebut;
# bila tidak, PHP membuang seluruh body dan pengguna melihat kegagalan CSRF
# 419, bukan pesan validasi ukuran berkas.
post_max_size=32M
upload_max_filesize=8M
variables_order=EGPCS

