server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Harus selaras dengan `post_max_size` pada docker/php/php.ini; nilai yang
    # lebih kecil membuat Nginx menolak unggahan sebelum PHP sempat memvalidasi.
    client_max_body_size 32m;

    # Aset teks dikirim mentah tanpa ini. Bundle aplikasi sekitar 229 KB
    # menyusut ke sekitar 71 KB terkompresi, dan HTML hasil render server ikut
    # menyusut, sehingga setiap pengunjung menghemat sebagian besar unduhan.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Hanya header yang nilainya identik dengan middleware SecurityHeaders
    # yang boleh ditambahkan di sini. `add_header` tidak menimpa header dari
    # upstream, sehingga X-Frame-Options atau Permissions-Policy dengan nilai
    # berbeda akan terkirim dua kali dan justru melemahkan proteksi. Sisanya
    # ditetapkan aplikasi agar hanya ada satu sumber kebenaran.
    add_header X-Content-Type-Options "nosniff" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /build/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /build/manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ^~ /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Laravel passkey discovery and future ACME-style well-known routes must
    # reach the application instead of the generic hidden-file deny rule.
    location ^~ /.well-known/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(?:/|$) {
        include fastcgi_params;
        # Header X-Forwarded-* dari terminator TLS diteruskan apa adanya oleh
        # Nginx dan hanya dipercaya Laravel bila `TRUSTED_PROXIES` memuat
        # alamat proxy tersebut.
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
