name: ecovillage

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  # Service `web` adalah satu-satunya jalur menuju PHP-FPM pada jaringan
  # Compose, sehingga header X-Forwarded-* darinya dapat dipercaya.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  # Render sisi server berjalan sebagai service tersendiri karena image PHP
  # tidak memuat Node. Bila service itu mati, Inertia jatuh ke render peramban.
  INERTIA_SSR_URL: http://ssr:13714
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis

x-app-volumes: &app-volumes
  - .:/var/www/html
  - vendor-data:/var/www/html/vendor

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  env_file:
    - .env
  environment: *app-environment
  volumes: *app-volumes
  working_dir: /var/www/html
  init: true
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-common
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    <<: *app-common
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --tries=3
      - --timeout=90
      - --max-time=3600
      - --no-interaction
    stop_grace_period: 30s

  scheduler:
    <<: *app-common
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction

  # Pada pengembangan, SSR dilayani server Vite sehingga service ini hanya
  # dipakai ketika menguji perilaku produksi. Bundle-nya dibangun
  # `npm run build:ssr` dan bersifat mandiri, tanpa node_modules.
  ssr:
    build:
      context: .
      dockerfile: Dockerfile
      target: ssr-production
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:13714/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  vite:
    <<: *app-common
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
      - node-modules-data:/var/www/html/node_modules
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"

  web:
    image: nginx:1.28-alpine
    init: true
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecovillage}
      MYSQL_USER: ${DB_USERNAME:-ecovillage}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  vendor-data:
  node-modules-data:

